; PlatformIO Project Configuration File for Water Quality Monitoring System
; Project: WaterQualityMonitor
; Board: Espressif ESP32 Dev Module (ESP-WROOM-32, 30-pin)
; Framework: Arduino C++

[env:esp32dev]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Sensor and utility libraries
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    bblanchon/ArduinoJson @ ^7.2.0
