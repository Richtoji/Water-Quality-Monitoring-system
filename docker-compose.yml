version: '3.8'

services:
  aquasense-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: aquasense-backend:latest
    container_name: aquasense-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ESP32_URL=http://10.189.27.140
      - POLL_INTERVAL_SEC=3
      - DB_PATH=/app/data/telemetry.db
      - PORT=8080
    volumes:
      - aquasense-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  aquasense-data:
    driver: local
